name: Release

# Publish prebuilt bootnode binaries, a Windows installer (Inno Setup), .deb and
# .rpm packages, the install.sh installer and compose.yaml as GitHub Release
# assets, and a multi-arch container image to GHCR. Two triggers:
#
# 1. vX.Y.Z tag pushed  →  create a formal Release (bumped version).
# 2. workflow_dispatch  →  build artifacts without a tag (useful for testing;
#                          optionally create a draft Release).
#
# Only the Python v1 implementation is built (`-l python`, the default); the
# rust/ port is wired into compile.sh once it exists. PyInstaller cannot
# cross-compile, so native binaries are built on per-OS matrix runners; the
# Linux-only .deb/.rpm packages are cross-built via Docker + qemu.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release (otherwise just build artifacts)"
        type: boolean
        default: false
      version_suffix:
        description: "Optional version suffix (e.g. 'dev', 'test123')"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { path: hsync-bootnode }
      # Path dependency: the Python implementation declares hsync-common as
      # {path = "../../hsync-common"}, so the sibling must be checked out next to
      # this repo. hsync-common is private, so the default GITHUB_TOKEN cannot
      # read it; authenticate with a PAT.
      - uses: actions/checkout@v7
        with:
          repository: albertsdk/hsync-common
          ref: main
          path: hsync-common
          token: ${{ secrets.HSYNC_COMMON_PAT }}
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      # Gate the markdown docs on valid relative links, including the cross-repo
      # pointers into the sibling hsync-common checkout (pure stdlib script).
      - name: Docs link-check
        working-directory: hsync-bootnode
        run: python ../hsync-common/scripts/dev/check_doc_links.py .
      - run: pipx install poetry
      - name: Configure in-project virtualenv
        working-directory: hsync-bootnode/python
        run: poetry config virtualenvs.in-project true
      - name: Install dependencies
        working-directory: hsync-bootnode/python
        run: poetry install --no-interaction --without build
      - name: Lint, types and unit tests
        working-directory: hsync-bootnode/python
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run mypy src/hsync_bootnode
          poetry run pytest -q
      - name: Lint the language-neutral suite
        working-directory: hsync-bootnode
        run: python/.venv/bin/python -m ruff check tests bench
      # Contract suite: spawns the console script and observes only the public
      # CLI + boot/1 wire, so it stays valid for the rust/ port.
      - name: Black-box suite (tests/)
        working-directory: hsync-bootnode
        run: HSYNC_BB_BOOTNODE=1 python/.venv/bin/python -m pytest -q tests/

  build-binaries:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,   target: linux-amd64,   archive: tar }
          - { os: ubuntu-24.04-arm, target: linux-arm64,  archive: tar }
          - { os: macos-latest,    target: darwin-arm64,  archive: tar }
          - { os: macos-15-intel,  target: darwin-amd64,  archive: tar }
          - { os: windows-latest,  target: windows-amd64, archive: zip }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with: { path: hsync-bootnode }
      - uses: actions/checkout@v7
        with:
          repository: albertsdk/hsync-common
          ref: main
          path: hsync-common
          token: ${{ secrets.HSYNC_COMMON_PAT }}
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pipx install poetry
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            BASE=$(grep -E '^version\s*=' hsync-bootnode/python/pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            SUFFIX="${{ inputs.version_suffix }}"
            if [ -n "$SUFFIX" ]; then
              echo "version=${BASE}-${SUFFIX}" >> "$GITHUB_OUTPUT"
            else
              echo "version=${BASE}" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Build native binary
        working-directory: hsync-bootnode
        run: |
          cd python
          poetry config virtualenvs.in-project true
          poetry install --with build --no-interaction
          cd ..
          ./compile.sh
      - name: Package binary
        working-directory: hsync-bootnode
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p release-out
          cd "dist/${{ matrix.target }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../../release-out/hsync-bootnode-${version}-${{ matrix.target }}.zip" hsync-bootnode.exe
          else
            tar czf "../../release-out/hsync-bootnode-${version}-${{ matrix.target }}.tar.gz" hsync-bootnode
          fi
      - name: Build the Windows installer (Inno Setup)
        # Per-machine installer (admin): installs the daemon + WinSW and
        # registers the hsync-bootnode Windows service.
        if: runner.os == 'Windows'
        working-directory: hsync-bootnode
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $winsw = Join-Path (Get-Location) "packaging/windows/WinSW-x64.exe"
          Invoke-WebRequest -Uri "https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe" -OutFile $winsw
          # Verify the downloaded binary before it is bundled into the installer.
          $winswSha256 = "05b82d46ad331cc16bdc00de5c6332c1ef818df8ceefcd49c726553209b3a0da"
          $actual = (Get-FileHash -Algorithm SHA256 -Path $winsw).Hash.ToLowerInvariant()
          if ($actual -ne $winswSha256) { throw "WinSW checksum mismatch: $actual" }
          $vi = "${{ steps.version.outputs.version }}" -replace '-.*$','' -replace '\+.*$',''
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" `
                  "/DVersionInfoVersion=$vi" `
                  "/DSourceExe=$((Resolve-Path 'dist/windows-amd64/hsync-bootnode.exe').Path)" `
                  "/DWinSWPath=$((Resolve-Path $winsw).Path)" `
                  "/DOutDir=$((Resolve-Path 'release-out').Path)" `
                  "packaging/windows/hsync-bootnode.iss"
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: hsync-bootnode/release-out/*

  build-packages:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { path: hsync-bootnode }
      - uses: actions/checkout@v7
        with:
          repository: albertsdk/hsync-common
          ref: main
          path: hsync-common
          token: ${{ secrets.HSYNC_COMMON_PAT }}
      # The package version is the resolved version (tag for a push, or the
      # pyproject base + optional suffix for a manual dispatch). It is exported
      # to compile.sh via HSYNC_VERSION so the .deb carries the same version as
      # the native archives and the release tag; compile.sh translates the SemVer
      # prerelease to the Debian form (~) for the .deb.
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            BASE=$(grep -E '^version\s*=' hsync-bootnode/python/pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            SUFFIX="${{ inputs.version_suffix }}"
            if [ -n "$SUFFIX" ]; then
              echo "version=${BASE}-${SUFFIX}" >> "$GITHUB_OUTPUT"
            else
              echo "version=${BASE}" >> "$GITHUB_OUTPUT"
            fi
          fi
      # The .deb images are cross-built for ARMv7/arm64 under qemu-user. The QEMU
      # that ships with the ubuntu-latest runner has regressed and makes gcc crash
      # deterministically with SIGSEGV (exit 139) while emitting -O3 code for some
      # CPython/OpenSSL translation units (e.g. Python/_warnings.c), aborting the
      # source builds even at -j1. Register a pinned, known-good QEMU/binfmt build
      # instead of relying on the runner default. A recent QEMU (v10.x) is
      # required: older lines (e.g. v7.0.0) avoid the gcc SIGSEGV but regress the
      # emulated link step, making CPython's libm probe (AC_CHECK_FUNCS
      # acosh/asinh/... -lm) fail with "requires C99 compatible libm" during
      # ./configure.
      - name: Set up QEMU (pinned, known-good)
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:qemu-v10.1.3
          platforms: arm,arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build .deb and .rpm packages
        working-directory: hsync-bootnode
        env:
          HSYNC_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./compile.sh --target deb-all
          ./compile.sh --target rpm-all
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            hsync-bootnode/dist/deb/*.deb
            hsync-bootnode/dist/rpm/*.rpm

  image:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with: { path: hsync-bootnode }
      - uses: actions/checkout@v7
        with:
          repository: albertsdk/hsync-common
          ref: main
          path: hsync-common
          token: ${{ secrets.HSYNC_COMMON_PAT }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine image tags
        id: tags
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            BASE=$(grep -E '^version\s*=' hsync-bootnode/python/pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            SUFFIX="${{ inputs.version_suffix }}"
            if [ -n "$SUFFIX" ]; then TAG="v${BASE}-${SUFFIX}"; else TAG="v${BASE}"; fi
          fi
          if [[ "${TAG}" == *-* ]]; then
            echo "tags=ghcr.io/albertsdk/hsync-bootnode:${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/albertsdk/hsync-bootnode:${TAG},ghcr.io/albertsdk/hsync-bootnode:latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: hsync-bootnode/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  release:
    needs: [build-binaries, build-packages, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { path: hsync-bootnode }
      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            BASE=$(grep -E '^version\s*=' hsync-bootnode/python/pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            SUFFIX="${{ inputs.version_suffix }}"
            if [ -n "$SUFFIX" ]; then
              echo "tag=v${BASE}-${SUFFIX}" >> "$GITHUB_OUTPUT"
            else
              echo "tag=v${BASE}" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Flatten assets
        run: |
          cd assets
          # download-artifact preserves the artifact's internal directory
          # structure, so the packages artifact lands under deb/. Move every file
          # to the top level for flat release assets.
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
      - name: Create latest aliases
        # Fixed-name copies so `releases/latest/download/<name>` is a stable link.
        # A missing source is skipped (that format was not built in this run).
        run: |
          cd assets
          mk_alias() {
            for spec in "$@"; do
              src="${spec%%|*}"
              dst="${spec##*|}"
              # shellcheck disable=SC2086
              if ls $src >/dev/null 2>&1; then cp $src "$dst"; fi
            done
          }
          mk_alias \
            "hsync-bootnode-*-linux-amd64.tar.gz|hsync-bootnode-linux-amd64.tar.gz" \
            "hsync-bootnode-*-linux-arm64.tar.gz|hsync-bootnode-linux-arm64.tar.gz" \
            "hsync-bootnode-*-darwin-arm64.tar.gz|hsync-bootnode-darwin-arm64.tar.gz" \
            "hsync-bootnode-*-darwin-amd64.tar.gz|hsync-bootnode-darwin-amd64.tar.gz" \
            "hsync-bootnode-*-windows-amd64.zip|hsync-bootnode-windows-amd64.zip" \
            "hsync-bootnode_*_amd64.deb|hsync-bootnode-amd64.deb" \
            "hsync-bootnode_*_arm64.deb|hsync-bootnode-arm64.deb" \
            "hsync-bootnode_*_armhf.deb|hsync-bootnode-armhf.deb" \
            "hsync-bootnode-*-1.el9.x86_64.rpm|hsync-bootnode-x86_64.rpm" \
            "hsync-bootnode-*-1.el9.aarch64.rpm|hsync-bootnode-aarch64.rpm" \
            "hsync-bootnode-*-windows-amd64-setup.exe|hsync-bootnode-windows-amd64-setup.exe"
      - name: Prepare installer and Compose file
        run: |
          # Pin the published installer to this release tag, and ship the
          # Compose file used by the manual Docker path.
          sed "s/^readonly DEFAULT_VERSION=.*/readonly DEFAULT_VERSION=\"${{ steps.tag.outputs.tag }}\"/" \
            hsync-bootnode/install.sh > "assets/install.sh"
          chmod 755 "assets/install.sh"
          cp hsync-bootnode/compose.yaml "assets/compose.yaml"
      - name: Generate checksums
        run: |
          cd assets
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        if: github.event_name == 'push' || inputs.create_release
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: assets/*
          generate_release_notes: true
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          make_latest: ${{ ! contains(steps.tag.outputs.tag, '-') }}
