[project]
name = "hsync-rendezvous"
version = "1.0.13"
description = "HSYNC P2P rendezvous node (no-log, in-memory, zero-knowledge)"
authors = [{name = "Alberto Basso", email = "17047798+albertsdk@users.noreply.github.com"}]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aioquic>=1.2.0,<2.0.0",
    "hsync-common==1.0.13",
    "pydantic>=2.12.0,<3.0.0",
    "typer>=0.26.0,<0.28.0",
    "uvloop>=0.23.0,<0.24.0; sys_platform != 'win32'",
]

[project.scripts]
hsync-rendezvous = "hsync_rendezvous.cli:app"

[tool.poetry]
packages = [{ include = "hsync_rendezvous", from = "src" }]

[tool.poetry.dependencies]
hsync-common = {path = "../../hsync-common", develop = true}

[tool.poetry.group.build.dependencies]
pyinstaller = "^6.22"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
ruff = "0.17.3"
mypy = "^2.1.0"
coverage = "^7.16"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["../../hsync-common"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "E402", "B904", "SIM115", "SIM117", "B008", "B017", "SIM101", "SIM103", "SIM105", "SIM118"]

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"